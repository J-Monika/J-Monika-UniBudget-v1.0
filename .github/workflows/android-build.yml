name: UniBudget Android CI — Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to avoid wasted runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; individual jobs override only what they need.
permissions:
  contents: read
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1 – JS Unit Tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    # Safety net: kills the job if tests hang (e.g. infinite loop in test code).
    timeout-minutes: 5

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # Job 2 – Build Debug APK
  # ─────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read   # needed by actions/upload-artifact and actions/cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up JDK 21 (Temurin LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # ── KEY FIX ───────────────────────────────────────────────────────────
      # android/.gitignore excludes two directories that Gradle requires:
      #   1. android/capacitor-cordova-android-plugins/  (entire directory)
      #      → android/app/capacitor.build.gradle applies cordova.variables.gradle
      #        from this dir; if it doesn't exist, Gradle throws GradleScriptException
      #   2. android/app/src/main/assets/public/         (bundled web assets)
      #      → the app is a Capacitor PWA; without web assets it will build but crash
      #
      # `npx cap sync android` regenerates BOTH from node_modules + www/.
      # It must run AFTER npm ci (so @capacitor/* packages exist in node_modules)
      # and BEFORE any ./gradlew invocation.
      # ──────────────────────────────────────────────────────────────────────
      - name: Sync Capacitor (regenerate native files & web assets)
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Cache Gradle wrapper & caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Linux runners require the execute bit on gradlew (not tracked by git).
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Set up Android SDK command line tools & platform 37
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-37" "build-tools;34.0.0" || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
        shell: bash

      - name: Build debug APK  (versionCode 10 / versionName "10.0")
        env:
          GRADLE_OPTS: >-
            -Xmx3g
            -XX:MaxMetaspaceSize=512m
            -XX:+HeapDumpOnOutOfMemoryError
            -Dfile.encoding=UTF-8
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dandroid.suppressUnsupportedCompileSdk=37 \
            -Dandroid.builder.sdkDownload=true
          #   ↑ Overrides org.gradle.java.home in gradle.properties so the
          #     Linux CI runner uses Temurin 21 instead of the local Windows path.

      # Upload the APK keyed by commit SHA so it can be downloaded by the
      # release job below. retention-days=30 matches the branch-push use-case.
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4   # Node 20 runtime ✔
        with:
          name: UniBudget-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Job 3 – GitHub Release  (v* tags only)
  # ─────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-debug
    # Only publish a release when a version tag (e.g. v.10) is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    # Short timeout — this job only downloads an artifact and calls the
    # GitHub API; no compilation involved.
    timeout-minutes: 15

    permissions:
      contents: write   # required to create/publish a GitHub Release
      actions: read     # required to download the artifact from build-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # Node 20 runtime ✔
        with:
          fetch-depth: 0
          # FIX: persist-credentials MUST be true here so that the
          # GITHUB_TOKEN is stored in Git config. softprops/action-gh-release
          # calls the GitHub API using these stored credentials to create the
          # release and upload the APK asset.
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      # FIX: Download the APK that was already built and verified by the
      # build-debug job above. This replaces the previous approach of
      # re-running the full JDK + Gradle + Node stack here, which:
      #   (a) wasted ~10 min of runner time on every release, and
      #   (b) risked producing a slightly different binary than what was tested.
      # The released APK is now byte-for-byte identical to the tested artifact.
      - name: Download APK from build-debug job
        uses: actions/download-artifact@v4   # Node 20 runtime ✔
        with:
          name: UniBudget-debug-${{ github.sha }}
          # Download into the workspace root for easy reference below.
          path: ./release-apk

      - name: Rename APK with version tag
        run: |
          cp ./release-apk/app-debug.apk \
             "UniBudget-${{ github.ref_name }}-debug.apk"

      # Publish the GitHub Release and upload the APK as a release asset.
      # GITHUB_TOKEN is auto-provided by Actions; the `token` input of this
      # action and the env var are both set for belt-and-suspenders auth.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          # Explicit token env var — some versions of the action prefer this
          # over the `token` input for API authentication.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "UniBudget ${{ github.ref_name }}"
          body: |
            ## UniBudget ${{ github.ref_name }}

            ### What's in this release
            - Budget alert system: 75 % and 100 % spending threshold notifications
            - Custom thresholds (percentage / fixed-amount / amount-remaining)
            - GCash / Maya / ShopeePay / GrabPay auto-detection
            - In-app warning banners + Android system push notifications
            - Per-category budget limits with live progress bars
            - Petsa de Peligro daily spend forecaster
            - Gamification: XP, levels, badges

            ### Sideload Installation
            1. Download `UniBudget-${{ github.ref_name }}-debug.apk`
            2. Transfer to your Android phone
            3. Tap the file → allow unknown sources → install
            4. Open UniBudget → sign up or log in
          files: UniBudget-${{ github.ref_name }}-debug.apk
          draft: false
          prerelease: false
