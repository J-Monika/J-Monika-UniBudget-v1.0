name: UniBudget Android CI — Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions — least privilege; individual jobs elevate as needed
permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────
  # Job 1 – JS unit tests
  # ───────────────────────────────────────────────────────────
  test:
    name: JS Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history prevents detached-HEAD issues

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run notification engine unit tests
        run: npm test

  # ───────────────────────────────────────────────────────────
  # Job 2 – Android debug APK build
  # ───────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Gradle wrapper + caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── CI environment patches ──────────────────────────────
      # 1. Point sdk.dir at the pre-installed Android SDK on the runner
      - name: Set Android SDK path in local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # 2. Strip the Windows-only JDK pin (C:\Users\MRMD\jdk21\...)
      #    Uses literal string match (-F) to avoid regex dot issues
      - name: Remove local Windows JDK pin from gradle.properties
        run: |
          grep -v "org.gradle.java.home" android/gradle.properties > /tmp/gradle.properties.ci
          mv /tmp/gradle.properties.ci android/gradle.properties
          echo "--- gradle.properties after patch ---"
          cat android/gradle.properties

      # 3. Cap JVM heap to 3g (GitHub free runners have 7 GB total RAM)
      - name: Patch JVM heap for CI (4g -> 3g)
        run: |
          sed -i 's/-Xmx4g/-Xmx3g/g' android/gradle.properties
      # ── End CI patches ──────────────────────────────────────

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniBudget-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # ───────────────────────────────────────────────────────────
  # Job 3 – GitHub Release (v* tags only)
  # ───────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-debug
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # required to create a GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Set Android SDK path in local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Remove local Windows JDK pin from gradle.properties
        run: |
          grep -v "org.gradle.java.home" android/gradle.properties > /tmp/gradle.properties.ci
          mv /tmp/gradle.properties.ci android/gradle.properties

      - name: Patch JVM heap for CI (4g -> 3g)
        run: sed -i 's/-Xmx4g/-Xmx3g/g' android/gradle.properties

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version tag
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "UniBudget-${{ github.ref_name }}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "UniBudget ${{ github.ref_name }}"
          body: |
            ## UniBudget ${{ github.ref_name }}

            ### What's in this release
            - Budget alert system: 75% and 100% spending threshold notifications
            - Custom thresholds (percentage / fixed-amount / amount-remaining)
            - GCash / Maya / ShopeePay / GrabPay auto-detection
            - In-app warning banners + Android system push notifications
            - Per-category budget limits with live progress bars
            - Petsa de Peligro daily spend forecaster
            - Gamification: XP, levels, badges

            ### Sideload Installation
            1. Download `UniBudget-${{ github.ref_name }}-debug.apk`
            2. Transfer to your Android phone (USB / Drive / email)
            3. Tap the file → allow unknown sources → install
            4. Open UniBudget → sign up or log in
          files: UniBudget-${{ github.ref_name }}-debug.apk
          draft: false
          prerelease: false
