name: UniBudget Android CI — Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs override as needed
permissions:
  contents: read
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1 – JS Unit Tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: JS Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # persist-credentials: false prevents the post-job git cleanup
          # step from running git commands that cause exit code 128
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run notification engine unit tests
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # Job 2 – Build Debug APK
  # ─────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # setup-java sets $JAVA_HOME to Temurin 21 — we pass this directly
      # to Gradle via -Dorg.gradle.java.home below (no file patching needed)
      - name: Set up JDK 21 (Temurin LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Gradle wrapper & caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Must run before any ./gradlew invocation on Linux
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Write local.properties — this file is gitignored, safe to overwrite
      # $ANDROID_SDK_ROOT is pre-set on all GitHub ubuntu-latest runners
      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # ── KEY FIX ──────────────────────────────────────────────
      # We do NOT patch android/gradle.properties (a tracked git file).
      # Patching tracked files causes the post-checkout cleanup to call
      # git with stale state and exit 128.
      #
      # Instead we override everything via environment + CLI flags:
      #   GRADLE_OPTS  → replaces org.gradle.jvmargs (-Xmx3g fits CI RAM)
      #   -Dorg.gradle.java.home → overrides the Windows local JDK path
      # ──────────────────────────────────────────────────────────
      - name: Build debug APK
        env:
          # 3 GB fits GitHub's 7 GB free runner (leaves room for Android tools)
          GRADLE_OPTS: >-
            -Xmx3g
            -XX:MaxMetaspaceSize=512m
            -XX:+HeapDumpOnOutOfMemoryError
            -Dfile.encoding=UTF-8
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniBudget-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Job 3 – GitHub Release (v* tags only)
  # ─────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-debug
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # required to publish a GitHub Release
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21 (Temurin LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build debug APK
        env:
          GRADLE_OPTS: >-
            -Xmx3g
            -XX:MaxMetaspaceSize=512m
            -XX:+HeapDumpOnOutOfMemoryError
            -Dfile.encoding=UTF-8
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Rename APK with version tag
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "UniBudget-${{ github.ref_name }}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "UniBudget ${{ github.ref_name }}"
          body: |
            ## UniBudget ${{ github.ref_name }}

            ### What's in this release
            - Budget alert system: 75% and 100% spending threshold notifications
            - Custom thresholds (percentage / fixed-amount / amount-remaining)
            - GCash / Maya / ShopeePay / GrabPay auto-detection
            - In-app warning banners + Android system push notifications
            - Per-category budget limits with live progress bars
            - Petsa de Peligro daily spend forecaster
            - Gamification: XP, levels, badges

            ### Sideload Installation
            1. Download `UniBudget-${{ github.ref_name }}-debug.apk`
            2. Transfer to your Android phone
            3. Tap the file → allow unknown sources → install
            4. Open UniBudget → sign up or log in
          files: UniBudget-${{ github.ref_name }}-debug.apk
          draft: false
          prerelease: false
