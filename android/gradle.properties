# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased heap for large Capacitor/AndroidX dependency graphs.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# org.gradle.java.home — intentionally left unset in this tracked file.
#
# WHY: A hard-coded Windows path here (e.g. C:\Users\...\jdk21) breaks the
# Linux CI runner, which does not have that path. Defining it here also
# overrides whatever JDK Android Studio or a CI workflow injects.
#
# CI: The GitHub Actions workflow passes -Dorg.gradle.java.home="$JAVA_HOME"
#     on the ./gradlew command line, which takes priority over this file.
#     The JDK is set to Temurin 21 by the actions/setup-java@v4 step.
#
# LOCAL (Android Studio): The IDE manages its own embedded JDK automatically.
#     If you need to pin a specific local JDK, set JAVA_HOME in your shell
#     profile instead of editing this tracked file.
#
# Require JDK 17–21: AGP 8.7 + Gradle 8.11.1 are tested with JDK 17–21.
# org.gradle.java.home=C\:\\Users\\MRMD\\jdk21\\jdk-21.0.11+10   ← Windows-only, do not uncomment on CI

# When configured, Gradle will run in incubating parallel mode.
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Enable non-transitive R classes for faster builds (AGP 8+ default)
android.nonTransitiveRClass=true

# Suppress the native-platform/restricted-method warning (harmless, JDK 21+)
org.gradle.configuration-cache=false

# Suppress warning for compileSdk 37 on AGP 8.7.3
android.suppressUnsupportedCompileSdk=37
android.builder.sdkDownload=true

